[package]
name = "stella_stage_tool"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/faraplay/stella_stage_tool"

[dependencies]
aes = "0.9.2"
binrw = "0.15.2"
cbc = "0.2.1"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
indexmap = "2.14.0"
quick-xml = { version = "0.41.0", features = ["async-tokio"] }
rand_mt = "6.0.3"
tokio = { version = "1.53.1", features = ["full"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
